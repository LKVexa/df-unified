name: Validate release
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: python -B tools/validate_release.py
      - name: Parse PowerShell entry points
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -LiteralPath ui -Filter *.ps1 -Recurse | ForEach-Object {
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$parseErrors)
            if ($parseErrors.Count) { $failed = $true; $parseErrors | Write-Output }
          }
          if ($failed) { exit 1 }
